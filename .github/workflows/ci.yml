name: Dynamo validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: node src/cli.mjs benchmark > benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: dynamo-benchmark-node-${{ matrix.node }}
          path: benchmark.json
