name: Verified source delivery
on:
  push:
    tags: ['v2.*']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: git archive --format=tar.gz --output=dynamo-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: dynamo-verified-source
          path: dynamo-source.tar.gz
